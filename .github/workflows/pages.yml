name: Pages

on: workflow_dispatch

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble static site
        run: |
          mkdir _site
          sed 's#\.\./##g' website/index.html > _site/index.html
          cp website/styles.css _site/styles.css
          cp -R docs data LICENSES _site/
          mkdir -p _site/repo/x86_64
          curl --fail --location --retry 3 https://github.com/vyeos/helm-settings/releases/download/v0.1.0/helm-settings-0.1.0-1-x86_64.pkg.tar.zst --output _site/repo/x86_64/helm-settings-0.1.0-1-x86_64.pkg.tar.zst
          curl --fail --location --retry 3 https://github.com/vyeos/helm-settings/releases/download/v0.1.0/helm-settings-0.1.0-1-x86_64.pkg.tar.zst.sig --output _site/repo/x86_64/helm-settings-0.1.0-1-x86_64.pkg.tar.zst.sig
          curl --fail --location --retry 3 https://github.com/vyeos/helm-settings/releases/download/v0.1.0/helm.db --output _site/repo/x86_64/helm.db
          curl --fail --location --retry 3 https://github.com/vyeos/helm-settings/releases/download/v0.1.0/helm.db.sig --output _site/repo/x86_64/helm.db.sig
          cp docs/keys/helm-release.asc _site/helm-release-signing-key.asc
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
