name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # v2
        with:
          command: check

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly fuzz run protocol_frame -- -max_total_time=30
      - run: cargo +nightly fuzz run config_documents -- -max_total_time=30
      - run: cargo +nightly fuzz run profile_json -- -max_total_time=30
