name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        toolchain: ["1.97.1", "stable"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install toolchain
        run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo +${{ matrix.toolchain }} fmt --all -- --check
      - name: Clippy
        run: cargo +${{ matrix.toolchain }} clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo +${{ matrix.toolchain }} test --workspace --locked

  arch:
    name: Arch native build
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git rust cargo
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: cargo test --workspace --locked

  html:
    name: HTML links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify local documentation links
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Links(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self, tag, attrs):
                  if tag in {'a','link'}:
                      self.links += [v for k,v in attrs if k in {'href'}]
          for page in list(Path('docs').rglob('*.html')) + [Path('README.html')]:
              parser=Links(); parser.feed(page.read_text())
              for link in parser.links:
                  if '://' not in link and not link.startswith(('#','mailto:')):
                      target=(page.parent/link.split('#')[0]).resolve()
                      assert target.exists(), f'{page}: missing {link}'
          PY
