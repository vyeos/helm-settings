[workspace]
resolver = "3"
members = [
  "crates/helm-model",
  "crates/helm-core",
  "crates/helm-transaction",
  "crates/helm-plugin-protocol",
  "crates/helm-settings-sdk",
  "crates/helm-cli",
  "crates/helm-gui",
  "crates/helm-settings",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
authors = ["vyeos <rudranpatel0980@gmail.com>"]
license = "MPL-2.0"
repository = "https://github.com/vyeos/helm-settings"

[workspace.dependencies]
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
rusqlite = "0.40"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
